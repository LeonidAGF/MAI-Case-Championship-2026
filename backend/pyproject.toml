[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-backend"
version = "1.0.0"
description = "Атлас доступности территорий СКФО — FastAPI-монолит (кейс А2): API, БД, ETL, what-if, чат"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "pgvector>=0.3",
    "redis>=5.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.0",
    # Shortest paths and nearest-node search for the ambulance travel times (app/ambulance).
    "scipy>=1.14",
    "pyarrow>=17",
    "anthropic>=2.6,<3",
    "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
embeddings = ["fastembed>=0.8,<0.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL (TEST_DATABASE_URL)"]
