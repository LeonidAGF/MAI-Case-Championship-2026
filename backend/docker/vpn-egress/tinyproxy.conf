# HTTP CONNECT proxy in front of the AmneziaWG tunnel. The API's Anthropic client connects here
# (LLM_PROXY_URL=http://vpn-egress:8888), and this container's only default route is the tunnel.
User nobody
Group nogroup
Port 8888
Timeout 600
MaxClients 50
DisableViaHeader Yes
# With no LogFile or Syslog set, tinyproxy logs to stdout (docker compose logs vpn-egress). The
# "Connect" level logs every CONNECT host:port, which shows exactly what used the tunnel.
LogLevel Connect

# Who may use the proxy: containers on the compose network. The port is never published on the host.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# What they may reach: HTTPS only, and only the hosts listed in allowed-hosts.
ConnectPort 443
Filter "/etc/tinyproxy/allowed-hosts"
FilterDefaultDeny Yes
