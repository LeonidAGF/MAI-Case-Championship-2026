# Backend stack for local development and the demo:
#   docker compose up -d --build        -> db + redis + api (migrations run on start)
#   docker compose run --rm api python -m app.cli seed
# MLOps can merge these services into the root compose; OSRM is theirs:
# point OSRM_CAR_URL / OSRM_FOOT_URL at it to enable the graph what-if method.
name: atlas-backend

services:
  db:
    build: ./docker/db
    image: atlas-db:pg16-postgis3-pgvector
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: atlas-api:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      # ML outputs (parquet) from the repository root, read-only.
      - ../data:/data:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
